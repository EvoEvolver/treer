<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treer</title>
  <link rel="stylesheet" href="/assets/xterm.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f8;
      color: #18211f;
      --ink: #18211f;
      --muted: #697572;
      --subtle: #8c9693;
      --line: #dde3e1;
      --line-strong: #cdd5d2;
      --surface: #ffffff;
      --surface-subtle: #f7f9f8;
      --accent: #087a61;
      --accent-hover: #05664f;
      --accent-soft: #e7f5f0;
      --nav: #17201f;
      --terminal: #0d1413;
      --danger: #b33a3a;
      --shadow-lg: 0 24px 70px rgba(16, 28, 25, .18), 0 3px 12px rgba(16, 28, 25, .08);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; min-width: 320px; overflow: hidden; background: #f5f7f8; -webkit-font-smoothing: antialiased; }
    ::selection { background: #bde5d9; color: #10241f; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); height: 34px; padding: 0 13px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease, box-shadow .16s ease; }
    button:hover { background: #f3f6f5; border-color: #aeb9b5; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(8, 122, 97, .16); outline-offset: 1px; border-color: var(--accent); }
    button:disabled { cursor: default; opacity: .5; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(5, 74, 58, .18); }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.danger { color: var(--danger); }
    input, select, textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; color: var(--ink); padding: 8px 10px; transition: border-color .16s ease, box-shadow .16s ease; }
    select { cursor: pointer; }
    #app { height: 100%; }
    header { height: 60px; background: var(--nav); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; border-bottom: 1px solid #2a3533; }
    .brand { display: flex; align-items: center; gap: 10px; flex: none; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 6px; background: #22a381; color: #fff; font-size: 15px; font-weight: 800; }
    .brand strong { font-size: 16px; font-weight: 700; }
    .workspace-control { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .workspace-label { color: #8f9c99; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    header select { width: 200px; height: 34px; border-color: #3b4745; background: #222d2b; color: #eff5f3; padding-block: 0; }
    .account { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .user { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
    .avatar { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #34413e; color: #c7d0cd; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    #currentUser { font-size: 12px; color: #d5dddb; }
    #connection { display: inline-flex; align-items: center; gap: 6px; min-width: 80px; color: #96a29f; font-size: 11px; text-transform: capitalize; }
    #connection::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #d39a46; box-shadow: 0 0 0 3px rgba(211, 154, 70, .1); }
    #connection.live::before { background: #37bb8b; box-shadow: 0 0 0 3px rgba(55, 187, 139, .11); }
    header button { height: 30px; padding: 0 10px; background: transparent; border-color: #3b4745; color: #d5dddb; font-size: 12px; }
    header button:hover { background: #26312f; border-color: #52605d; }
    main { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: calc(100vh - 60px); min-height: 0; }
    aside { min-width: 0; border-right: 1px solid var(--line); background: #f9fbfa; overflow: auto; }
    .pane-title { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; color: #4c5956; }
    .count { min-width: 24px; padding: 2px 7px; border-radius: 10px; background: #e8edeb; color: #65716e; font-size: 11px; text-align: center; }
    #servers { padding: 8px; }
    .server { position: relative; padding: 11px 12px; margin-bottom: 3px; border: 1px solid transparent; border-radius: 6px; }
    .server:hover { background: #fff; border-color: var(--line); }
    .server-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .server-name { min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; }
    .server-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.inline-action { height: 26px; padding: 0 7px; border-color: transparent; background: transparent; color: var(--muted); font-size: 10px; box-shadow: none; }
    button.inline-action:hover { border-color: var(--line); background: var(--surface-subtle); color: var(--ink); }
    .meta { color: var(--subtle); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; line-height: 1.45; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #aab3b0; flex: none; }
    .dot.online { background: #20a777; box-shadow: 0 0 0 3px rgba(32, 167, 119, .1); }
    #workspacePane { display: grid; grid-template-rows: 54px minmax(112px, 24vh) 44px minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--surface); }
    .toolbar, .terminal-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
    .section-title { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
    .section-title strong { font-size: 14px; }
    #revision { color: var(--subtle); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    #agentTable { min-height: 0; overflow: auto; background: #fff; border-bottom: 1px solid var(--line-strong); scrollbar-color: #c0cac6 #f7f9f8; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid #e9edeb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    th { height: 34px; color: #84908c; font-size: 10px; font-weight: 700; text-transform: uppercase; background: #f8faf9; position: sticky; top: 0; z-index: 1; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f5f9f7; }
    tbody tr.selected { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
    tbody td:first-child { font-weight: 650; color: #23302d; }
    .kind { color: #596662; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .status { display: inline-flex; align-items: center; gap: 6px; min-width: 74px; color: #64716d; font-size: 11px; font-weight: 650; text-transform: capitalize; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
    .status.blocked { color: #a76b12; }
    .status.working, .status.starting { color: #16769a; }
    .status.idle { color: #218561; }
    .status.failed, .status.exited { color: var(--danger); }
    .terminal-bar { background: #151e1c; color: #d8e0de; border-color: #2b3533; }
    .terminal-identity { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
    #terminalName { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #terminalMeta { color: #7f8d89; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .terminal-actions { display: flex; align-items: center; gap: 7px; flex: none; }
    .terminal-actions button { height: 28px; padding: 0 9px; color: #cfd8d5; background: #202a28; border-color: #384441; font-size: 11px; }
    .terminal-actions button:hover { background: #293532; border-color: #53605d; }
    .terminal-actions button.danger { color: #ffaaa4; }
    #terminalStatus { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; color: #84938f; font-size: 10px; min-width: 82px; text-align: right; text-transform: uppercase; }
    #terminalStatus::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    #terminalHost { min-width: 0; min-height: 0; height: 100%; padding: 11px 10px; background: var(--terminal); overflow: hidden; }
    #terminalHost .xterm { height: 100%; }
    #terminalHost .xterm-viewport { scrollbar-color: #465360 #0b1117; }
    .terminal-empty { height: 100%; display: grid; place-items: center; color: #66736f; font-size: 12px; }
    .field { margin-top: 15px; }
    .field label { display: block; font-size: 11px; font-weight: 650; color: #55615e; margin-bottom: 6px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    dialog { width: min(520px, calc(100vw - 28px)); border: 1px solid rgba(206, 215, 212, .9); border-radius: 8px; padding: 0; color: var(--ink); background: #fff; box-shadow: var(--shadow-lg); }
    dialog::backdrop { background: rgba(16, 26, 23, .48); backdrop-filter: blur(3px); }
    dialog form { padding: 24px; }
    dialog h2 { font-size: 18px; line-height: 1.25; margin: 0 0 18px; }
    dialog .actions { justify-content: flex-end; }
    #installCommand { min-height: 88px; resize: none; font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.45; }
    #inviteUrl { min-height: 74px; resize: none; font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.45; }
    #authDialog { width: min(400px, calc(100vw - 28px)); }
    #authDialog::backdrop { background: #17201f; }
    #authDialog h2::before { content: 'T'; display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 22px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 18px; }
    .form-error { min-height: 18px; margin-top: 10px; color: var(--danger); font-size: 12px; }
    .auth-switch { margin-right: auto; border: 0; padding: 0; color: var(--accent); background: transparent; box-shadow: none; }
    #empty { color: #87928f; padding: 28px 12px; text-align: center; font-size: 12px; }
    @media (max-width: 760px) {
      body { overflow: auto; }
      header { height: 56px; gap: 10px; padding: 0 12px; }
      .brand strong, .workspace-label { display: none; }
      .brand { gap: 0; }
      header select { width: min(32vw, 150px); }
      .account { gap: 5px; }
      .user, #connection { display: none; }
      header button { padding: 0 8px; }
      main { display: block; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .pane-title { height: 44px; }
      #servers { display: flex; overflow-x: auto; }
      .server { min-width: 190px; margin: 0 4px 0 0; }
      #workspacePane { display: grid; grid-template-rows: 52px 150px 44px 58vh; min-height: 650px; }
      .toolbar { padding: 0 10px; }
      .toolbar-actions { gap: 5px; }
      .toolbar-actions button { padding: 0 9px; }
      th:nth-child(3), td:nth-child(3) { display: none; }
      th, td { padding-inline: 10px; }
      .terminal-identity { max-width: 36vw; }
      #terminalMeta { display: none; }
      #terminalStatus { display: none; }
      #terminalHost { padding: 6px 4px; }
      dialog form { padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app" hidden>
  <header>
    <div class="brand"><span class="brand-mark">T</span><strong>treer</strong></div>
    <div class="workspace-control"><span class="workspace-label">Workspace</span><select id="workspace" aria-label="Workspace"></select></div>
    <div class="account"><div class="user"><span class="avatar" id="userAvatar"></span><span id="currentUser"></span></div><button id="inviteButton" hidden>Invite</button><button id="logoutButton">Log out</button><span id="connection">connecting</span></div>
  </header>
  <main>
    <aside><div class="pane-title"><span>Machines</span><span class="count" id="serverCount">0</span></div><div id="servers"></div></aside>
    <section id="workspacePane">
      <div class="toolbar"><span class="section-title"><strong>Agents</strong><span class="count" id="agentCount">0</span><small id="revision"></small></span><div class="toolbar-actions"><button id="installButton">Add machine</button><button class="primary" id="createButton">New agent</button></div></div>
      <div id="agentTable"></div>
      <div class="terminal-bar">
        <div class="terminal-identity"><span id="terminalName">Terminal</span><span id="terminalMeta"></span></div>
        <div class="terminal-actions"><span id="terminalStatus">not attached</span><button id="renameAgent" disabled>Rename</button><button id="reconnectTerminal" disabled>Reconnect</button><button class="danger" id="stopAgent" disabled>Stop</button></div>
      </div>
      <div id="terminalHost"><div class="terminal-empty">Select an agent to attach</div></div>
    </section>
  </main>
  </div>
  <dialog id="authDialog">
    <form id="loginForm">
      <h2>Sign in to Treer</h2>
      <div class="field"><label for="loginUsername">Username</label><input id="loginUsername" value="admin" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <div class="form-error" id="loginError"></div>
      <div class="actions"><button class="primary" type="submit">Sign in</button></div>
    </form>
    <form id="registerForm" hidden>
      <h2>Join Treer</h2>
      <input id="registerInvite" type="hidden">
      <div class="field"><label for="registerUsername">Username</label><input id="registerUsername" autocomplete="username" minlength="3" maxlength="32" required></div>
      <div class="field"><label for="registerPassword">Password</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="form-error" id="registerError"></div>
      <div class="actions"><button class="auth-switch" type="button" id="showLogin">Sign in instead</button><button class="primary" type="submit">Create account</button></div>
    </form>
  </dialog>
  <dialog id="createDialog">
    <form id="createForm">
      <h2>Create agent</h2>
      <div class="field"><label for="createServer">Machine</label><select id="createServer" required></select></div>
      <div class="field"><label for="createKind">Kind</label><select id="createKind"><option>codex</option><option>claude</option><option>command</option></select></div>
      <div class="field"><label for="createName">Name</label><input id="createName" required></div>
      <div class="field"><label for="createCwd">Working directory, relative to machine root</label><input id="createCwd" value="."></div>
      <div class="field"><label for="createArgs">Arguments, one per line</label><textarea id="createArgs" rows="3"></textarea></div>
      <div class="actions"><button type="button" id="cancelCreate">Cancel</button><button class="primary" type="submit">Create</button></div>
    </form>
  </dialog>
  <dialog id="installDialog">
    <form method="dialog">
      <h2>Add machine</h2>
      <div class="field"><label for="installCommand">Run on the target machine</label><textarea id="installCommand" readonly></textarea></div>
      <div class="actions"><button value="close">Close</button><button class="primary" type="button" id="copyInstall">Copy</button></div>
    </form>
  </dialog>
  <dialog id="renameDialog">
    <form id="renameForm">
      <h2 id="renameTitle">Rename</h2>
      <input id="renameKind" type="hidden">
      <input id="renameTarget" type="hidden">
      <div class="field"><label for="renameName">Name</label><input id="renameName" maxlength="80" required></div>
      <div class="actions"><button type="button" id="cancelRename">Cancel</button><button class="primary" type="submit">Rename</button></div>
    </form>
  </dialog>
  <dialog id="inviteDialog">
    <form method="dialog">
      <h2>Invite user</h2>
      <div class="field"><label for="inviteUrl">Registration link</label><textarea id="inviteUrl" readonly></textarea></div>
      <div class="actions"><button value="close">Close</button><button class="primary" type="button" id="copyInvite">Copy</button></div>
    </form>
  </dialog>
  <script src="/assets/xterm.js"></script>
  <script src="/assets/addon-fit.js"></script>
  <script>
    const state = { workspace: 'default', snapshot: null, selected: null, socket: null, user: null };
    const terminalState = { agentId: null, terminal: null, fit: null, socket: null, input: null, observer: null, resizeTimer: null, reconnectTimer: null };
    const $ = id => document.getElementById(id);
    const api = async (path, options) => {
      const response = await fetch(path, { headers: { 'content-type': 'application/json' }, ...options });
      const body = await response.json();
      if (!response.ok) { const error = new Error(body.error?.message || `HTTP ${response.status}`); error.status = response.status; throw error; }
      return body;
    };
    async function authenticate() {
      try {
        state.user = await api('/api/auth/me');
        showApplication();
      } catch (error) {
        if (error.status !== 401) throw error;
        showAuthentication(new URLSearchParams(location.search).get('invite'));
      }
    }
    function showAuthentication(invite) {
      $('app').hidden = true;
      $('registerForm').hidden = !invite;
      $('loginForm').hidden = Boolean(invite);
      $('registerInvite').value = invite || '';
      $('authDialog').showModal();
      (invite ? $('registerUsername') : $('loginUsername')).focus();
    }
    async function showApplication() {
      if ($('authDialog').open) $('authDialog').close();
      $('app').hidden = false;
      $('currentUser').textContent = state.user.username;
      $('userAvatar').textContent = state.user.username.slice(0, 1);
      $('inviteButton').hidden = !state.user.is_admin;
      history.replaceState(null, '', location.pathname);
      await loadWorkspaces();
    }
    async function loadWorkspaces() {
      const data = await api('/api/workspaces');
      $('workspace').innerHTML = data.workspaces.map(w => `<option value="${escapeHtml(w.workspace_id)}">${escapeHtml(w.name)}</option>`).join('');
      if (!data.workspaces.some(w => w.workspace_id === state.workspace)) state.workspace = data.workspaces[0]?.workspace_id;
      $('workspace').value = state.workspace;
      await refresh(); connectEvents();
    }
    async function refresh() {
      state.snapshot = await api(`/api/workspaces/${encodeURIComponent(state.workspace)}/snapshot`);
      if (state.selected && !state.snapshot.agents.some(a => a.agent_id === state.selected)) state.selected = null;
      if (!state.selected && state.snapshot.agents.length) state.selected = state.snapshot.agents[0].agent_id;
      render();
      if (state.selected && terminalState.agentId !== state.selected) openTerminal(state.selected);
    }
    function render() {
      const snapshot = state.snapshot; if (!snapshot) return;
      $('revision').textContent = `rev ${snapshot.revision}`;
      $('serverCount').textContent = snapshot.servers.length;
      $('agentCount').textContent = snapshot.agents.length;
      $('servers').innerHTML = snapshot.servers.length ? snapshot.servers.map(server => `
        <div class="server"><div class="server-heading"><div class="server-name"><span>${escapeHtml(server.name || server.hostname || server.server_id)}</span><span class="dot ${server.status}" title="${escapeHtml(server.status)}"></span></div><button class="inline-action rename-machine" data-server="${escapeHtml(server.server_id)}" type="button">Rename</button></div>
        <div class="meta">${escapeHtml(server.server_id)}</div><div class="meta">${escapeHtml(server.root)}</div></div>`).join('') : '<div id="empty">No machines connected</div>';
      $('createServer').innerHTML = snapshot.servers.filter(s => s.status === 'online').map(s => `<option value="${escapeHtml(s.server_id)}">${escapeHtml(s.name || s.hostname)} · ${escapeHtml(s.server_id)}</option>`).join('');
      $('agentTable').innerHTML = snapshot.agents.length ? `<table><thead><tr><th style="width:28%">Name</th><th style="width:18%">Status</th><th style="width:20%">Kind</th><th>Machine</th></tr></thead><tbody>${snapshot.agents.map(agent => `
        <tr data-agent="${escapeHtml(agent.agent_id)}" class="${state.selected === agent.agent_id ? 'selected' : ''}" aria-selected="${state.selected === agent.agent_id}"><td>${escapeHtml(agent.name)}</td><td><span class="status ${agent.status}">${escapeHtml(agent.status)}</span></td><td><span class="kind">${escapeHtml(agent.kind)}</span></td><td>${escapeHtml(machineName(agent.server_id))}</td></tr>`).join('')}</tbody></table>` : '<div id="empty">No agents in this workspace</div>';
      document.querySelectorAll('[data-agent]').forEach(row => row.onclick = () => selectAgent(row.dataset.agent));
      document.querySelectorAll('.rename-machine').forEach(button => button.onclick = () => {
        const server = state.snapshot.servers.find(item => item.server_id === button.dataset.server);
        if (server) showRename('machine', server.server_id, server.name || server.hostname);
      });
      renderTerminalBar();
    }
    function machineName(serverId) {
      const server = state.snapshot?.servers.find(item => item.server_id === serverId);
      return server?.name || server?.hostname || serverId;
    }
    function renderTerminalBar() {
      const agent = state.snapshot?.agents.find(item => item.agent_id === state.selected);
      $('terminalName').textContent = agent?.name || 'Terminal';
      $('terminalMeta').textContent = agent ? `${agent.agent_id} · ${agent.server_id}` : '';
      $('renameAgent').disabled = !agent;
      $('reconnectTerminal').disabled = !agent;
      $('stopAgent').disabled = !agent || ['exited', 'failed'].includes(agent.status);
    }
    function selectAgent(agentId) {
      if (state.selected === agentId && terminalState.agentId === agentId) { terminalState.terminal?.focus(); return; }
      state.selected = agentId; render(); openTerminal(agentId);
    }
    function disposeTerminal() {
      const socket = terminalState.socket;
      terminalState.socket = null;
      if (socket) socket.close();
      terminalState.input?.dispose(); terminalState.observer?.disconnect();
      clearTimeout(terminalState.resizeTimer); clearTimeout(terminalState.reconnectTimer);
      terminalState.terminal?.dispose();
      Object.assign(terminalState, { agentId: null, terminal: null, fit: null, input: null, observer: null, resizeTimer: null, reconnectTimer: null });
      $('terminalHost').replaceChildren();
    }
    function openTerminal(agentId) {
      disposeTerminal();
      terminalState.agentId = agentId;
      $('terminalStatus').textContent = 'connecting';
      const terminal = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontFamily: 'SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        fontSize: 13,
        lineHeight: 1.12,
        scrollback: 10000,
        allowTransparency: false,
        theme: { background: '#0b1117', foreground: '#d6dee6', cursor: '#79d4ad', selectionBackground: '#365267', black: '#17212b', red: '#ff7b72', green: '#79d4ad', yellow: '#e3b341', blue: '#79b8ff', magenta: '#c297ff', cyan: '#56d4dd', white: '#d6dee6', brightBlack: '#677786' }
      });
      const fit = new FitAddon.FitAddon();
      terminal.loadAddon(fit); terminal.open($('terminalHost'));
      terminalState.terminal = terminal; terminalState.fit = fit;
      requestAnimationFrame(() => { fit.fit(); connectTerminalSocket(agentId); });
      terminalState.input = terminal.onData(data => {
        const socket = terminalState.socket;
        if (socket?.readyState === WebSocket.OPEN) socket.send(new TextEncoder().encode(data));
      });
      terminalState.observer = new ResizeObserver(() => {
        clearTimeout(terminalState.resizeTimer);
        terminalState.resizeTimer = setTimeout(() => {
          if (terminalState.agentId !== agentId) return;
          fit.fit(); sendTerminalResize();
        }, 60);
      });
      terminalState.observer.observe($('terminalHost'));
    }
    function connectTerminalSocket(agentId) {
      if (terminalState.agentId !== agentId) return;
      clearTimeout(terminalState.reconnectTimer);
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const terminal = terminalState.terminal;
      const socket = new WebSocket(`${scheme}://${location.host}/api/workspaces/${encodeURIComponent(state.workspace)}/agents/${encodeURIComponent(agentId)}/terminal?cols=${terminal.cols}&rows=${terminal.rows}`);
      socket.binaryType = 'arraybuffer';
      terminalState.socket = socket;
      socket.onmessage = event => {
        if (terminalState.socket !== socket) return;
        if (event.data instanceof ArrayBuffer) {
          terminal.write(new Uint8Array(event.data));
          return;
        }
        const message = JSON.parse(event.data);
        if (message.type === 'ready') {
          terminal.reset();
          $('terminalStatus').textContent = 'live'; terminal.focus();
        } else if (message.type === 'closed') {
          $('terminalStatus').textContent = message.reason === 'agent server disconnected' ? 'reconnecting' : 'closed';
          if (message.reason && message.reason !== 'agent server disconnected') terminal.writeln(`\r\n\x1b[31m[treer] ${message.reason}\x1b[0m`);
        } else if (message.type === 'error') {
          $('terminalStatus').textContent = 'error';
          terminal.writeln(`\r\n\x1b[31m[treer] ${message.error?.message || 'terminal error'}\x1b[0m`);
        }
      };
      socket.onerror = () => { if (terminalState.socket === socket) $('terminalStatus').textContent = 'error'; };
      socket.onclose = () => {
        if (terminalState.socket !== socket || terminalState.agentId !== agentId) return;
        const agent = state.snapshot?.agents.find(item => item.agent_id === agentId);
        if (!agent || ['exited', 'failed'].includes(agent.status)) { $('terminalStatus').textContent = 'closed'; return; }
        $('terminalStatus').textContent = 'reconnecting';
        terminalState.reconnectTimer = setTimeout(() => connectTerminalSocket(agentId), 700);
      };
    }
    function sendTerminalResize() {
      const socket = terminalState.socket; const terminal = terminalState.terminal;
      if (socket?.readyState === WebSocket.OPEN && terminal) socket.send(JSON.stringify({ type: 'resize', cols: terminal.cols, rows: terminal.rows }));
    }
    async function stopAgent() {
      if (!state.selected) return;
      try { await api(`/api/workspaces/${encodeURIComponent(state.workspace)}/agents/${encodeURIComponent(state.selected)}/stop`, { method: 'POST', body: '{}' }); }
      catch (error) { alert(error.message); }
    }
    function defaultAgentName() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `agent-${now.getFullYear()}-${month}-${day}`;
    }
    function showCreate() {
      $('createName').value = defaultAgentName();
      $('createDialog').showModal();
      $('createName').focus();
      $('createName').select();
    }
    function showRename(kind, target, name) {
      $('renameKind').value = kind;
      $('renameTarget').value = target;
      $('renameName').value = name;
      $('renameTitle').textContent = kind === 'machine' ? 'Rename machine' : 'Rename agent';
      $('renameDialog').showModal();
      $('renameName').focus();
      $('renameName').select();
    }
    async function submitRename(event) {
      event.preventDefault();
      const kind = $('renameKind').value;
      const target = encodeURIComponent($('renameTarget').value);
      const resource = kind === 'machine' ? `servers/${target}` : `agents/${target}`;
      try {
        await api(`/api/workspaces/${encodeURIComponent(state.workspace)}/${resource}`, { method: 'PATCH', body: JSON.stringify({ name: $('renameName').value }) });
        $('renameDialog').close();
        await refresh();
      } catch (error) { alert(error.message); }
    }
    async function showInstall() {
      try {
        const data = await api(`/api/workspaces/${encodeURIComponent(state.workspace)}/bootstrap`, { method: 'POST', body: '{}' });
        $('installCommand').value = data.command;
        $('copyInstall').textContent = 'Copy';
        $('installDialog').showModal();
      } catch (error) { alert(error.message); }
    }
    async function copyInstall() {
      const command = $('installCommand').value;
      try {
        await navigator.clipboard.writeText(command);
      } catch (_) {
        $('installCommand').select();
        document.execCommand('copy');
      }
      $('copyInstall').textContent = 'Copied';
    }
    async function createInvite() {
      try {
        const invitation = await api('/api/admin/invitations', { method: 'POST', body: '{}' });
        $('inviteUrl').value = invitation.url;
        $('copyInvite').textContent = 'Copy';
        $('inviteDialog').showModal();
      } catch (error) { alert(error.message); }
    }
    async function copyText(source, button) {
      const value = $(source).value;
      try { await navigator.clipboard.writeText(value); }
      catch (_) { $(source).select(); document.execCommand('copy'); }
      $(button).textContent = 'Copied';
    }
    function connectEvents() {
      state.socket?.close();
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${scheme}://${location.host}/api/workspaces/${encodeURIComponent(state.workspace)}/events`); state.socket = socket;
      socket.onopen = () => { $('connection').textContent = 'live'; $('connection').classList.add('live'); };
      socket.onclose = () => { $('connection').textContent = 'reconnecting'; $('connection').classList.remove('live'); if (state.socket === socket) setTimeout(connectEvents, 1200); };
      socket.onmessage = event => { const message = JSON.parse(event.data); if (message.event === 'workspace.snapshot') { state.snapshot = message.data; render(); } else { refresh(); } };
    }
    $('workspace').onchange = async event => { disposeTerminal(); state.workspace = event.target.value; state.selected = null; await refresh(); connectEvents(); };
    $('authDialog').oncancel = event => event.preventDefault();
    $('loginForm').onsubmit = async event => { event.preventDefault(); $('loginError').textContent = ''; try { state.user = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: $('loginUsername').value, password: $('loginPassword').value }) }); await showApplication(); } catch (error) { $('loginError').textContent = error.message; } };
    $('registerForm').onsubmit = async event => { event.preventDefault(); $('registerError').textContent = ''; try { state.user = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ invite: $('registerInvite').value, username: $('registerUsername').value, password: $('registerPassword').value }) }); await showApplication(); } catch (error) { $('registerError').textContent = error.message; } };
    $('showLogin').onclick = () => { $('registerForm').hidden = true; $('loginForm').hidden = false; $('loginUsername').focus(); };
    $('inviteButton').onclick = createInvite;
    $('copyInvite').onclick = () => copyText('inviteUrl', 'copyInvite');
    $('logoutButton').onclick = async () => { try { await api('/api/auth/logout', { method: 'POST', body: '{}' }); } finally { location.href = '/'; } };
    $('installButton').onclick = showInstall;
    $('copyInstall').onclick = copyInstall;
    $('createButton').onclick = showCreate;
    $('cancelCreate').onclick = () => $('createDialog').close();
    $('cancelRename').onclick = () => $('renameDialog').close();
    $('renameForm').onsubmit = submitRename;
    $('renameAgent').onclick = () => {
      const agent = state.snapshot?.agents.find(item => item.agent_id === state.selected);
      if (agent) showRename('agent', agent.agent_id, agent.name);
    };
    $('reconnectTerminal').onclick = () => { if (state.selected) openTerminal(state.selected); };
    $('stopAgent').onclick = stopAgent;
    $('createForm').onsubmit = async event => { event.preventDefault(); try { const agent = await api(`/api/workspaces/${encodeURIComponent(state.workspace)}/agents`, { method: 'POST', body: JSON.stringify({ server_id: $('createServer').value, kind: $('createKind').value, name: $('createName').value, cwd: $('createCwd').value, args: $('createArgs').value.split('\n').map(v => v.trim()).filter(Boolean), cols: 120, rows: 36 }) }); $('createDialog').close(); state.selected = agent.agent_id; await refresh(); } catch (error) { alert(error.message); } };
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
    authenticate().catch(error => { $('app').hidden = false; $('connection').textContent = error.message; });
  </script>
</body>
</html>
