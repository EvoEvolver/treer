[workspace]
members = [
  "crates/treer-platform",
  "crates/treer-agent-runtime",
  "crates/treer-agent-server",
  "crates/treer-agent-host",
  "crates/treer-build-info",
  "crates/treer-cli",
  "crates/treer-host-protocol",
  "crates/treer-protocol",
  "crates/treer-proxy",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "kv", "ring", "server_2_14"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ed25519-dalek = "2"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1"] }
http-body = "1"
http-body-util = "0.1"
ipnet = "2"
portable-pty = "0.9"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.30.2"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
strip-ansi-escapes = "0.2"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
treer-build-info = { path = "crates/treer-build-info" }
treer-platform = { path = "crates/treer-platform" }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Hashing and base64 are on the hot path of the upload tests (hundreds of
# megabytes per run); optimizing only these crates keeps debug test runs short.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

# Updater unit fixtures authenticate/copy their own executable under the same
# 128 MiB limit as production images. Linux DWARF must not inflate that fixture;
# retain symbols/backtraces and leave development/release profiles unchanged.
[profile.test.package.treer-agent-server]
strip = "debuginfo"
