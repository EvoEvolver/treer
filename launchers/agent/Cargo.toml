[package]
name = "treer-agent-launcher"
version = "0.0.1"
edition = "2021"
publish = false

# Standalone workspace with its own Cargo.lock, separate from Core.
[workspace]

[features]
fixture-harness = []

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
uuid = { version = "1", features = ["v4"] }
treer-platform = { path = "../../crates/treer-platform" }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
