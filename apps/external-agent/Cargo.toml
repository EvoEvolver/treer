[package]
name = "treer-external-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Independent App; intentionally outside the Core workspace.
[workspace]

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
rustix = { version = "1.1", features = ["fs", "process"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.4.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = { version = "2", features = ["serde"] }
httparse = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
