[package]
name = "treer-message-endpoint"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# This App is released independently; do not add it to the Core workspace.
[workspace]

[dependencies]
hmac = "0.12.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
