name: treer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-treer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-treer}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.14.4-alpine3.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  proxy:
    image: ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-proxy:${TREER_IMAGE_TAG:-stable}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      updater:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      PORT: "8787"
      TREER_PROXY_PUBLIC_URL: "${TREER_PROXY_PUBLIC_URL:-http://127.0.0.1:8787/}"
      TREER_APP_PUBLIC_URL: "${TREER_APP_PUBLIC_URL:-http://127.0.0.1:3000/}"
      TREER_NATS_URL: "nats://nats:4222"
      TREER_NATS_STREAM: "TREER_EVENTS"
      TREER_NATS_SUBJECT_PREFIX: "treer.v1.events"
      TREER_NATS_CLUSTER_SUBJECT_PREFIX: "treer.v1.cluster"
      TREER_ENABLE_CORE_MESSAGES: "true"
      TREER_UPDATER_URL: "http://updater:7420"
      TREER_UPDATER_TOKEN: "${TREER_UPDATER_TOKEN:?set TREER_UPDATER_TOKEN}"
    ports:
      - "8787:8787"

  app:
    image: ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-app:${TREER_IMAGE_TAG:-stable}
    restart: unless-stopped
    environment:
      PORT: "8080"
      TREER_PROXY_PUBLIC_URL: "${TREER_PROXY_PUBLIC_URL:-http://127.0.0.1:8787/}"
    depends_on:
      proxy:
        condition: service_started
    ports:
      - "3000:8080"

  updater:
    image: ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-updater:${TREER_IMAGE_TAG:-stable}
    restart: unless-stopped
    environment:
      TREER_LISTEN: "0.0.0.0:7420"
      TREER_UPDATER_TOKEN: "${TREER_UPDATER_TOKEN:?set TREER_UPDATER_TOKEN}"
      TREER_COMPOSE_FILE: /compose/compose.yaml
      TREER_COMPOSE_PROJECT: treer
      TREER_UPDATE_CHANNEL: "${TREER_IMAGE_TAG:-stable}"
      TREER_GHCR_OWNER: "${TREER_GHCR_OWNER:-evoevolver}"
      TREER_PROXY_IMAGE: "ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-proxy"
      TREER_APP_IMAGE: "ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-app"
      TREER_UPDATER_IMAGE: "ghcr.io/${TREER_GHCR_OWNER:-evoevolver}/treer-updater"
      TREER_GHCR_TOKEN: "${TREER_GHCR_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7420/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  nats-data:
