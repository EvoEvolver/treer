[package]
name = "treer-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
url.workspace = true
tracing.workspace = true
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "net", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

# Win32 has no safe system-call API. Keep FFI inside the reviewed windows module;
# the public platform interface and all consumers remain safe Rust.
[lints.rust]
unsafe_code = "deny"
