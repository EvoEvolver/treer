[package]
name = "treer-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
url.workspace = true
tracing.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[example]]
name = "treer-breakaway-probe"
test = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "net", "event"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_SystemServices"] }

# Keep Win32/libproc FFI inside the reviewed platform modules;
# the public platform interface and all consumers remain safe Rust.
[lints.rust]
unsafe_code = "deny"
