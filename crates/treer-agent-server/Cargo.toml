[package]
name = "treer-agent-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Dedicated disposable hosted native acceptance build only; never a release default.
native-update-acceptance = []
# Opt-in test measurement only; the allocator dependency is never runtime.
metrics-allocation-measurement = []

[dev-dependencies]
allocation-counter = "=0.8.1"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
ed25519-dalek = { workspace = true, features = ["pem"] }
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strip-ansi-escapes.workspace = true
subtle.workspace = true
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
nvml-wrapper = "=0.11.0"
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
treer-agent-runtime = { path = "../treer-agent-runtime" }
treer-build-info.workspace = true
treer-platform.workspace = true
treer-host-protocol = { path = "../treer-host-protocol" }
treer-protocol = { path = "../treer-protocol" }
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["user", "socket", "poll", "process", "hostname"] }
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs"] }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
