name: Build macOS ARM64 artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build darwin-aarch64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version --verbose

      - name: Build agent binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --target aarch64-apple-darwin \
            -p treer-cli \
            -p treer-agent-host \
            -p treer-agent-server

      - name: Stage and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_dir=target/aarch64-apple-darwin/release
          artifact_dir=release-artifacts
          mkdir -p "$artifact_dir"

          for binary in treer treer-agent-host treer-agent-server; do
            artifact="$artifact_dir/$binary-darwin-aarch64"
            cp "$source_dir/$binary" "$artifact"
            chmod 755 "$artifact"
            codesign --force --sign - "$artifact"
            codesign --verify --strict "$artifact"
            file "$artifact" | grep -q "Mach-O 64-bit executable arm64"
          done

          (
            cd "$artifact_dir"
            shasum -a 256 \
              treer-darwin-aarch64 \
              treer-agent-host-darwin-aarch64 \
              treer-agent-server-darwin-aarch64 \
              > SHA256SUMS-darwin-aarch64.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: treer-darwin-aarch64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes
          fi
          gh release upload "$tag" release-artifacts/* --clobber
