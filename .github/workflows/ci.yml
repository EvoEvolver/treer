name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and PostgreSQL tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TREER_TEST_DATABASE_URL: postgres://treer:treer@127.0.0.1:55432/treer_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: treer
          POSTGRES_PASSWORD: treer
          POSTGRES_DB: treer_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U treer -d treer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace binaries
        run: cargo build --workspace --locked
      - name: Test workspace including database boundaries
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Frontend types and build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
