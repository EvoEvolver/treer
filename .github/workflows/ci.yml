name: CI
run-name: Windows artifact exec diagnostic ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows evidence ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: exact-candidate-test-binary
            runner: windows-2022
            source: 8ba1f2fb446aade1f37d3c00ea547712b2d60f3d
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.90.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ matrix.source }}
      - name: Record source commit
        run: '"TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified launcher payload
        run: |
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-launcher-release.mjs --output "$env:RUNNER_TEMP/treer-launcher-payload" --source-commit "$env:TREER_BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select MSVC Rust
        run: |
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version --verbose
      - name: Build exact 8ba1f2f test executable without running tests
        if: matrix.mode == 'exact-candidate-test-binary'
        run: |
          cargo build --locked -p treer-agent-server -p treer-agent-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-agent-server --bin treer-agent-server --no-run --message-format=json > test-build.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bins = @(Get-Content test-build.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'treer-agent-server' -and $_.profile.test -eq $true -and $_.executable })
          if ($bins.Count -ne 1) { throw 'Expected exactly one Controller test binary' }
          New-Item -ItemType Directory -Path test-binary/deps | Out-Null
          Copy-Item target/debug/treer-agent-server.exe,target/debug/treer-agent-host.exe -Destination test-binary/
          Copy-Item -LiteralPath $bins[0].executable -Destination test-binary/deps/controller-tests.exe
          $hash = (Get-FileHash test-binary/deps/controller-tests.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "diagnostic-controller-sha256=$hash"
          Write-Output "diagnostic-source-commit=$env:TREER_BUILD_COMMIT"
          "diagnostic-controller-sha256=$hash" >> $env:GITHUB_STEP_SUMMARY
          "diagnostic-source-commit=$env:TREER_BUILD_COMMIT" >> $env:GITHUB_STEP_SUMMARY
          "$hash  deps/controller-tests.exe" | Set-Content -Encoding ascii test-binary/SHA256SUMS
          foreach ($name in @('treer-agent-server.exe','treer-agent-host.exe')) {
            $digest=(Get-FileHash "test-binary/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "sibling-sha256=$digest file=$name"
            "$digest  $name" | Add-Content -Encoding ascii test-binary/SHA256SUMS
          }
          $sums=(Get-FileHash test-binary/SHA256SUMS -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "out-of-band-sums-sha256=$sums"
          "out-of-band-sums-sha256=$sums" >> $env:GITHUB_STEP_SUMMARY
          "$env:TREER_BUILD_COMMIT" | Set-Content -Encoding ascii test-binary/SOURCE_COMMIT
      - name: Isolated native real Host wrapper
        run: |
          cargo test --locked -p treer-agent-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-agent-server --bin treer-agent-server service::tests::windows_real_host_detached_restart_and_stop -- --exact --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload diagnostic test executable only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-8ba1f2f-controller-tests
          path: test-binary/
          if-no-files-found: error
          retention-days: 3
