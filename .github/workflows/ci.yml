name: Exact Node ancestor diagnostic
run-name: Ancestor222 after39699367118
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read ONLY exact Node and ancestor metadata
        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          import os,stat,pathlib,hashlib,json
          if os.environ.get("GITHUB_ACTIONS")!="true" or os.environ.get("RUNNER_ENVIRONMENT")!="github-hosted" or os.uname().sysname!="Linux" or os.geteuid()==0:raise SystemExit("wrong diagnostic target")
          p=pathlib.Path("/usr/local/bin/node")
          st=p.lstat()
          result={"scope":"READ_ONLY exact failed ancestor classification; no Node execution/chmod/updater","uid":os.geteuid(),"image":os.environ.get("ImageVersion"),"file":{"realpath":str(p.resolve()),"regular":stat.S_ISREG(st.st_mode),"uid":st.st_uid,"gid":st.st_gid,"mode":oct(stat.S_IMODE(st.st_mode)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()},"ancestors":[]}
          for a in p.parents:
           m=a.lstat();result["ancestors"].append({"path":str(a),"uid":m.st_uid,"gid":m.st_gid,"mode":oct(stat.S_IMODE(m.st_mode)),"directory":stat.S_ISDIR(m.st_mode),"root_or_euid":m.st_uid in (0,os.geteuid()),"mode_trusted":not bool(m.st_mode&0o022)})
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-ancestor-diagnostic.json"
          with out.open("x") as f:json.dump(result,f,indent=2);f.flush();os.fsync(f.fileno())
          print(json.dumps(result))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: treer222-ancestor-diagnostic
          path: ${{ runner.temp }}/treer222-ancestor-diagnostic.json
          if-no-files-found: error
          retention-days: 7
