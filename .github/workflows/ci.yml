name: CI
run-name: Windows artifact exec diagnostic ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Isolated Windows real Host root validation
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.90.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record source commit
        run: '"TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified launcher payload
        run: |
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-launcher-release.mjs --output "$env:RUNNER_TEMP/treer-launcher-payload" --source-commit "$env:TREER_BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select MSVC Rust
        run: |
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version --verbose
      - name: Build sibling Host and Controller
        run: |
          cargo build --locked -p treer-agent-host -p treer-agent-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate isolated real Host exact fixture
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server service::tests::windows_real_host_detached_restart_and_stop -- --exact --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record parent metadata only after probes
        if: always()
        run: |
          Write-Output "image=$env:ImageOS version=$env:ImageVersion"
          Write-Output "pwsh=$($PSVersionTable.PSVersion)"
          Write-Output ('parent-variable-names=' + ((Get-ChildItem Env: | Select-Object -ExpandProperty Name | Sort-Object) -join ','))
          powershell.exe -NoProfile -NonInteractive -Command '[Console]::WriteLine($PSVersionTable.PSVersion.ToString()); exit 0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
