name: CI
run-name: Windows exec diagnostic ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exec-diagnostic:
    name: Windows exec diagnostics only
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/treer-windows-exec-diagnostic-target
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify fixed diagnostic source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne '${{ github.sha }}') { throw 'diagnostic source mismatch' }
          Write-Output "diagnostic_commit=$actual"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select native MSVC Rust
        run: |
          rustup toolchain install 1.90.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.90.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          node --version
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run frozen read-only diagnostics
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server controller::exec_environment_tests::windows_powershell_exec_diagnostics -- --exact --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-exec-diagnostic.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP/windows-exec-diagnostic.log" -SimpleMatch "production/startup:" -Quiet)) { throw "diagnostic test did not execute" }
