name: ConPTY runtime distinction 224
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-isolation:
    name: Host isolation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bf16c075f637323c39fa27efecef944e82e1f8c2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: host224-native
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent runtime native tests without fail-fast
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, platform, re, subprocess
          source='bf16c075f637323c39fa27efecef944e82e1f8c2'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert platform.system()=='Windows'
          results=[]
          tests=['tests::windows_conpty_argv_input_resize_and_stop','tests::cancelled_async_input_reclaims_writer_after_owned_stop']
          for test in tests:
              command=['cargo','test','--locked','-p','treer-agent-runtime',test,'--','--exact','--nocapture','--test-threads=1']
              try:
                  result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
                  print(result.stdout,flush=True)
                  row={'test':test,'exit_code':result.returncode,'passed':result.returncode==0 and bool(re.search(r'test result: ok\. 1 passed; 0 failed;',result.stdout))}
              except subprocess.TimeoutExpired as error:
                  output=error.stdout or b''
                  print(output.decode(errors='replace') if isinstance(output,bytes) else output,flush=True)
                  row={'test':test,'passed':False,'timeout':True}
              row.update(source_sha=source,workflow_sha=os.environ['GITHUB_SHA'],os=platform.system())
              results.append(row)
              print('CONPTY_224_DISTINCTION '+json.dumps(row,sort_keys=True),flush=True)
          print('CONPTY_224_DISTINCTION_COMPLETE '+json.dumps(results,sort_keys=True),flush=True)
          assert all(row['passed'] for row in results), 'individual runtime results preserved; not all passed'
          PYTHON
