name: Host isolation native 224
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-isolation:
    name: Host isolation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 43455c5f6058a3d9794bf5d28057fc365bd5af86
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: host224-native
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source build Clippy and real PTY isolation
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, platform, re, subprocess
          source="43455c5f6058a3d9794bf5d28057fc365bd5af86"
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          meta={'source_sha':source,'workflow_sha':os.environ['GITHUB_SHA'],'os':platform.system(),'live_machine_changed':False}
          print(json.dumps(meta),flush=True)
          for cmd in [['cargo','build','--locked','-p','treer-agent-host','-p','treer-agent-runtime'],['cargo','clippy','--locked','-p','treer-agent-host','-p','treer-agent-runtime','--all-targets','--','-D','warnings']]:
              subprocess.run(cmd,check=True,timeout=1800)
          tests=[('treer-agent-host','isolation_tests::real_pty_backpressure_preserves_other_workload_control_and_unknown_no_replay'),('treer-agent-host','isolation_tests::same_connection_sync_stop_and_disconnect_do_not_cancel_or_replay_admitted_write'),('treer-agent-host','isolation_tests::exhausted_mutation_lane_has_no_queue_and_preserves_controls'),('treer-agent-host','isolation_tests::unknown_tombstone_survives_completed_result_eviction'),('treer-agent-runtime','tests::cancelled_async_input_reclaims_writer_after_owned_stop'),('treer-agent-runtime','tests::windows_conpty_argv_input_resize_and_stop' if platform.system()=='Windows' else 'tests::unix_native_fixture_argv_input_resize_and_stop')]
          results=[]
          for package,test in tests:
              cmd=['cargo','test','--locked','-p',package,test,'--','--exact','--nocapture','--test-threads=1']
              result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
              print(result.stdout,flush=True)
              row={'test':test,'passed':int(result.returncode==0 and bool(re.search(r'test result: ok\. 1 passed; 0 failed;',result.stdout))),'exit_code':result.returncode,'source_sha':source,'os':platform.system()}
              results.append(row)
              print('HOST_ISOLATION_224_TEST '+json.dumps(row),flush=True)
          meta.update(passed=all(row['passed']==1 for row in results),exact_tests=len(tests),native_pty_lifecycle=True,blocked_write_evidence='Windows native pipe fault injection; not actual ConPTY sustained backpressure',controller_restart_scope='request acknowledgement; not enrolled Controller recovery')
          print('HOST_ISOLATION_224_RESULT '+json.dumps(meta,sort_keys=True),flush=True)
          assert meta['passed'], 'individual results preserved; at least one failed or zero-filter test'
          PYTHON
