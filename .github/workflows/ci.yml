name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and PostgreSQL tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TREER_TEST_DATABASE_URL: postgres://treer:treer@127.0.0.1:55432/treer_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: treer
          POSTGRES_PASSWORD: treer
          POSTGRES_DB: treer_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U treer -d treer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Release workflow security regressions (fake registry only)
        run: node --test scripts/release-security.test.mjs scripts/install-checksums.test.mjs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace binaries
        run: cargo build --workspace --locked
      - name: Test workspace including database boundaries
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Frontend types and build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  agent-launcher:
    name: Agent launcher types, fake harnesses and browser
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launchers/agent/package-lock.json
      - name: Install launcher dependencies
        run: npm --prefix launchers/agent ci
      - name: Install isolated browser runtime
        run: cd launchers/agent && npx playwright install --with-deps chromium
      - name: Check launcher and browser sources
        run: npm --prefix launchers/agent run check
      - name: Unit and installer tests (fake harnesses only)
        run: npm --prefix launchers/agent test
      - name: Closed Codex, ACP and Claude Interface regression
        run: |
          node --test scripts/ais-e2e.test.mjs
          node scripts/ais-e2e.mjs
      - name: Browser controls and screenshots
        run: npm --prefix launchers/agent run test:browser
        env:
          CODEX_UI_SCREENSHOTS: ${{ runner.temp }}/launcher-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: agent-launcher-screenshots
          path: ${{ runner.temp }}/launcher-screenshots
          if-no-files-found: ignore

  release-tooling:
    name: Release tooling and fake machine updates
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Closed release, checksum, detachment and rollback tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Documentation links and launcher test isolation
        run: |
          node scripts/check-docs.mjs
          node --test scripts/ais-e2e.test.mjs
