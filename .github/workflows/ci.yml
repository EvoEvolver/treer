name: Linux runtime writer remedy 198
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-remedy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5ad8cc3698a2c9397ebbd25ee2db7e864a15ef31
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
      - name: Exact source runtime and Host suites and strict Clippy
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 5ad8cc3698a2c9397ebbd25ee2db7e864a15ef31
          printf 'RUNTIME_REMEDY_SOURCE=%s WRAPPER=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
          cargo test --locked -p treer-agent-runtime -p treer-agent-host --lib -- --nocapture 2>&1 | tee runtime-remedy.log
          grep -F 'tests::cancelled_async_input_reclaims_writer_after_owned_stop' runtime-remedy.log
          grep -F 'test tests::writer_permit_covers_writer_destruction ... ok' runtime-remedy.log
          grep -F 'test tests::cancelled_async_input_reclaims_writer_after_owned_stop ... ok' runtime-remedy.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' runtime-remedy.log
          cargo clippy --locked -p treer-agent-runtime -p treer-agent-host --all-targets -- -D warnings
