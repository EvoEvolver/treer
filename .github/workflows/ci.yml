name: Machine metrics isolated native 220
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metrics:
    name: Native metrics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c5273eb95519c528fc7eb2ce21362d62e0045c5
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: metrics220-native
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source build, Clippy and real sampler/disk/reopen/query
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, platform, re, subprocess
          source='8c5273eb95519c528fc7eb2ce21362d62e0045c5'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==source, 'tested source mismatch'
          meta={'source_sha':head,'workflow_sha':os.environ['GITHUB_SHA'],'os':platform.system(),'runner_os':os.environ['RUNNER_OS'],'runner_image':os.environ.get('ImageOS'),'rust':subprocess.check_output(['rustc','--version'],text=True).strip(),'install_or_restart':False,'native_nvml_proven':False}
          print(json.dumps(meta),flush=True)
          commands=[['cargo','build','--locked','-p','treer-agent-server','--bins'],['cargo','clippy','--locked','-p','treer-agent-server','--all-targets','--','-D','warnings']]
          for command in commands:
              subprocess.run(command,check=True)
          command=['cargo','test','--locked','-p','treer-agent-server','--bin','treer-agent-server','machine_metrics::runtime::tests::actual_os_sampler_to_disk_and_wire_query','--','--exact','--nocapture','--test-threads=1']
          result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          print(result.stdout,flush=True)
          assert result.returncode==0, 'native actual-entry command failed'
          assert re.search(r'test result: ok\. 1 passed; 0 failed;',result.stdout), 'zero or wrong test count refused'
          target={'Linux':'linux','Windows':'windows'}[platform.system()]
          assert f'actual_metrics_entry os={target} samples>=2' in result.stdout, 'actual CPU/RAM sampling marker missing'
          assert f'actual_metrics_entry os={target} disk_reopen=ok bounded_wire=ok; native_NVML_not_proven' in result.stdout, 'actual disk/reopen/wire marker missing'
          image_command=['cargo','test','--locked','-p','treer-agent-server','--bin','treer-agent-server','machine_metrics::runtime::native::image_tests::helper_refuses_replaced_modified_and_job_local_images','--','--exact','--nocapture','--test-threads=1']
          image=subprocess.run(image_command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          print(image.stdout,flush=True)
          assert image.returncode==0 and re.search(r'test result: ok\. 1 passed; 0 failed;',image.stdout), 'image pin test zero/failed refused'
          meta.update(passed=True,actual_tests=1,cpu_ram_sample=True,disk_reopen=True,bounded_wire=True,image_pin_actual_tests=1,image_pin_passed=True)
          print('NATIVE_METRICS_220_RESULT '+json.dumps(meta,sort_keys=True),flush=True)
          PYTHON
