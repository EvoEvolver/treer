name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-email-component-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 2065ab3a66b0893b795919a3aa422e24e8f71a84
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2065ab3a66b0893b795919a3aa422e24e8f71a84
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
      - name: Build only the changed Hub component
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          cargo build --locked --release --target-dir "$RUNNER_TEMP/app-target" --manifest-path apps/message-endpoint/Cargo.toml --features hub --bin treer-message-hub
      - name: Package actual binaries and bind source, UI, lockfile, and sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,stat,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'app-package'
          root.mkdir(mode=0o700)
          package=root/'payload';package.mkdir(mode=0o700)
          if os.uname().sysname!='Linux' or os.uname().machine!='x86_64':raise SystemExit('platform_mismatch')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if source!=os.environ['SOURCE_COMMIT']:raise SystemExit('source_mismatch')
          rows=[]
          for name in ['treer-message-hub']:
              origin=pathlib.Path(os.environ['RUNNER_TEMP'])/'app-target'/'release'/name
              destination=package/name
              with origin.open('rb') as src,destination.open('xb') as dst:shutil.copyfileobj(src,dst)
              destination.chmod(0o700);s=destination.lstat()
              if not stat.S_ISREG(s.st_mode) or s.st_uid!=os.geteuid() or s.st_nlink!=1 or not 0<s.st_size<=134217728:raise SystemExit('artifact_metadata')
              h=hashlib.sha256()
              with destination.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              digest=h.hexdigest()
              rows.append({'name':name,'bytes':s.st_size,'sha256':digest,'mode':'0700','format':subprocess.check_output(['file','-b',str(destination)],text=True).strip()})
          leaves=['apps/message-endpoint/src/hub_runtime.rs','apps/message-endpoint/src/settings_http.rs','apps/message-endpoint/Cargo.lock','apps/message-endpoint/Cargo.toml','apps/message-endpoint/dist/index.html','apps/message-endpoint/dist/app.js','apps/message-endpoint/dist/app.css']
          leaf_hashes={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in leaves}
          provenance={'schema':1,'source_commit':source,'wrapper_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'platform':'linux-x86_64','profile':'release','hub_feature':True,'files':rows,'source_leaves':leaf_hashes,'deployment':'NOT_RUN','channel_traffic':'NOT_RUN','core_native_build':'NOT_RUN','tests':'existing_evidence_reused_no_rerun'}
          for path,data in [(package/'SHA256SUMS',''.join(r['sha256']+'  '+r['name']+'\n' for r in rows)),(package/'provenance.json',json.dumps(provenance,indent=2)+'\n'),(root/'build-provenance.json',json.dumps(provenance,indent=2)+'\n')]:
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'w') as f:f.write(data);f.flush();os.fsync(f.fileno())
          with tarfile.open(root/'hub-linux-x86_64.tar.gz','x:gz') as tar:
              for path in sorted(package.iterdir()):tar.add(path,arcname=path.name,recursive=False)
          print(json.dumps({'source_commit':source,'files':rows,'deployment':'NOT_RUN'}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-hub-linux-x86_64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app-package/hub-linux-x86_64.tar.gz
            ${{ runner.temp }}/app-package/build-provenance.json
          retention-days: 14
          if-no-files-found: error
