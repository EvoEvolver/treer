name: Linux runtime writer remedy strict Clippy 198
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-clippy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5ad8cc3698a2c9397ebbd25ee2db7e864a15ef31
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
          components: clippy
      - name: Exact source remaining strict Clippy
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 5ad8cc3698a2c9397ebbd25ee2db7e864a15ef31
          printf 'RUNTIME_REMEDY_SOURCE=%s WRAPPER=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
          cargo clippy --locked -p treer-agent-runtime -p treer-agent-host --all-targets -- -D warnings
