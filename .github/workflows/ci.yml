name: Linux runtime reclamation diagnostic 198
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e7a668ca49077798678b791b4ccd05ed7e314f63
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
      - name: Exact source runtime suite with default parallel scheduling
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = e7a668ca49077798678b791b4ccd05ed7e314f63
          printf 'RUNTIME_DIAGNOSTIC_SOURCE=%s WRAPPER=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
          cargo test --locked -p treer-agent-runtime --lib -- --nocapture 2>&1 | tee runtime-diagnostic.log
          grep -F 'tests::cancelled_async_input_reclaims_writer_after_owned_stop' runtime-diagnostic.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed;' runtime-diagnostic.log
