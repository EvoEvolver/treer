name: Dedicated hosted native update
run-name: Native222 e936adcf physical replacement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TREER_BUILD_COMMIT: e936adcfce47c24f8e92fb0e531b9b080fce0330
      RUST_VERSION: 1.90.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: e936adcfce47c24f8e92fb0e531b9b080fce0330
      - name: Provision ONLY leader7762 exact pinned existing Node mode
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          #!/usr/bin/env python3
          """Decision222:7762: only exact existing Node mode in a disposable hosted job."""
          import os,stat,pathlib,hashlib,subprocess,json,sys
          if sys.flags.optimize != 0:
           raise SystemExit("refused: Python optimization disables provisioning guards")
          NODE=pathlib.Path("/usr/local/bin/node")
          EXPECTED="fde6a4bf8d0562f7751d1a2d6cb9b417c4cfe107bbcb0aa3e9a24e125e348f48"
          assert os.environ.get("GITHUB_ACTIONS")=="true"
          assert os.environ.get("RUNNER_ENVIRONMENT")=="github-hosted"
          assert os.uname().sysname=="Linux" and os.geteuid()!=0
          assert NODE.resolve(strict=True)==NODE
          st=NODE.lstat()
          assert stat.S_ISREG(st.st_mode) and st.st_uid==0 and stat.S_IMODE(st.st_mode)==0o777
          fd=os.open(NODE,os.O_RDONLY|os.O_NOFOLLOW)
          try:
           held=os.fstat(fd)
           identity=(held.st_dev,held.st_ino)
           assert identity==(st.st_dev,st.st_ino)
           def digest():
            os.lseek(fd,0,os.SEEK_SET)
            h=hashlib.sha256()
            while True:
             b=os.read(fd,1048576)
             if not b:break
             h.update(b)
            return h.hexdigest()
           assert digest()==EXPECTED
           version=subprocess.check_output([str(NODE),"--version"],text=True,timeout=8).strip()
           assert version=="v22.23.3"
           ancestors=[]
           for ancestor in NODE.parents:
            m=ancestor.lstat()
            ancestors.append({"path":str(ancestor),"uid":m.st_uid,"gid":m.st_gid,"mode":oct(stat.S_IMODE(m.st_mode))})
            assert stat.S_ISDIR(m.st_mode) and m.st_uid in (0,os.geteuid()) and not m.st_mode&0o022
           before=NODE.lstat()
           assert (before.st_dev,before.st_ino)==identity and before.st_uid==0 and stat.S_IMODE(before.st_mode)==0o777
           assert digest()==EXPECTED
           subprocess.run(["/usr/bin/sudo","-n","/usr/bin/chmod","0755","--",str(NODE)],check=True,timeout=8)
           after=NODE.lstat();retained=os.fstat(fd)
           assert (after.st_dev,after.st_ino)==identity==(retained.st_dev,retained.st_ino)
           assert stat.S_ISREG(after.st_mode) and after.st_uid==0 and stat.S_IMODE(after.st_mode)==0o755
           assert digest()==EXPECTED
           for component in (NODE,*NODE.parents):
            m=component.lstat()
            assert m.st_uid in (0,os.geteuid()) and not m.st_mode&0o022
           assert subprocess.check_output([str(NODE),"--version"],text=True,timeout=8).strip()==version
           result={"decision":"222:7762","path":str(NODE),"sha256":EXPECTED,"version":version,"device":after.st_dev,"inode":after.st_ino,"before_mode":"0777","after_mode":"0755","root_owner_retained":True,"ancestor_inventory":ancestors,"scope":"test target preparation only","production_trusted_file_invocation":"must be exercised by unchanged Core2 positive entry"}
           out=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-node-provisioning.json"
           with out.open("x") as f:json.dump(result,f,indent=2);f.write("\n")
           print(json.dumps(result))
          finally:os.close(fd)
          PYTHON
      - name: Build verified portable launcher payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/treer222-evidence"
          test "$(git rev-parse HEAD)" = "$TREER_BUILD_COMMIT"
          /usr/local/bin/node --version
          npm --prefix launchers/agent ci --ignore-scripts
          /usr/local/bin/node scripts/prepare-launcher-release.mjs --output "$RUNNER_TEMP/treer222-launcher-payload" --source-commit "$TREER_BUILD_COMMIT"
      - name: Build exact old feature submitter and NEW portable native images
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo build --locked --target-dir target/acceptance-old --features native-update-acceptance -p treer-agent-server -p treer-cli 2>&1 | tee "$RUNNER_TEMP/treer222-evidence/old-build.log"
          cargo build --locked --release --target-dir target/acceptance-new -p treer-agent-server -p treer-cli -p treer-agent-host 2>&1 | tee "$RUNNER_TEMP/treer222-evidence/new-build.log"
      - name: Create ONE fresh private input root from source-bound artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          import os,pwd,pathlib,uuid,shutil,hashlib,json,subprocess
          source="e936adcfce47c24f8e92fb0e531b9b080fce0330"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==source
          home=pathlib.Path(pwd.getpwuid(os.geteuid()).pw_dir).resolve(strict=True)
          assert home==pathlib.Path(os.environ["HOME"]).resolve(strict=True)
          root=home/("treer-native-acceptance-"+str(uuid.uuid4()))
          root.mkdir(mode=0o700);(root/"bin").mkdir(mode=0o700);(root/"artifacts").mkdir(mode=0o700)
          old=pathlib.Path("target/acceptance-old/debug");new=pathlib.Path("target/acceptance-new/release")
          for name in ["treer","treer-agent-server"]:shutil.copyfile(old/name,root/"bin"/name)
          # Preserve SAME actual Host image across the update; the fixture never updates Host.
          shutil.copyfile(new/"treer-agent-host",root/"bin/treer-agent-host")
          for name in ["treer","treer-agent-host","treer-agent-server"]:
           shutil.copyfile(new/name,root/"artifacts"/name)
           for folder in ["bin","artifacts"]:(root/folder/name).chmod(0o755)
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          version_outputs={}
          for group in ["bin","artifacts"]:
           for name in ["treer","treer-agent-server","treer-agent-host"]:
            text=subprocess.check_output([str(root/group/name),"--version"],text=True,timeout=8).strip()
            assert source in text, "actual native version must match source"
            version_outputs[group+"/"+name]=text
          sums="".join(digest(root/"artifacts"/n)+"  "+n+"\n" for n in ["treer","treer-agent-host","treer-agent-server"])
          (root/"artifacts/SHA256SUMS").write_text(sums);(root/"artifacts/SHA256SUMS").chmod(0o600)
          def identity(group):return {"release_sha":source,"artifact_source_sha":source,"controller_sha256":digest(root/group/"treer-agent-server"),"cli_sha256":digest(root/group/"treer")}
          assert identity("bin")["controller_sha256"]!=identity("artifacts")["controller_sha256"]
          input={"current":identity("bin"),"target":{"target_id":"acceptance-normal-e936adcf","identity":identity("artifacts"),"platform":"linux-x86_64","version_label":"same-source feature-to-normal physical replacement"},"sums_sha256":digest(root/"artifacts/SHA256SUMS"),"host_sha256":digest(root/"bin/treer-agent-host")}
          with (root/"acceptance-input.json").open("x") as f:json.dump(input,f,indent=2)
          (root/"acceptance-input.json").chmod(0o600)
          evidence=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-evidence";evidence.mkdir(exist_ok=True)
          with (evidence/"source-artifact-binding.json").open("x") as f:json.dump({"source":source,"run_id":os.environ["GITHUB_RUN_ID"],"same_source_physical_replacement_only":True,"version_outputs":version_outputs,"input":input,"root":str(root)},f,indent=2)
          with open(os.environ["GITHUB_ENV"],"a") as f:
           f.write("TREER_ACCEPTANCE_ROOT="+str(root)+"\nXDG_CONFIG_HOME="+str(root/"xdg")+"\nTREER_STATE_DIR="+str(root/"state")+"\nTREER_DISPOSABLE_RUNNER=1\n")
          PYTHON
      - name: Execute ONE exact ignored hosted native transaction
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target-dir target/acceptance-old -p treer-agent-server --features native-update-acceptance --bin treer-agent-server -- --exact self_update::hosted_acceptance::fixture_tests::hosted_complete_native_fixture --ignored 2>&1 | tee "$RUNNER_TEMP/treer222-evidence/actual-native.log"
          python3 -I -B - <<'PYTHON'
          import os,pathlib,json,re
          evidence=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-evidence"
          text=(evidence/"actual-native.log").read_text()
          if not re.search(r"test result: ok\. 1 passed; 0 failed;",text):raise SystemExit("exact hosted test did not run once")
          root=pathlib.Path(os.environ["TREER_ACCEPTANCE_ROOT"])
          result=json.loads((root/"native-acceptance-result.json").read_text())
          cleanup=json.loads((root/"fixture-cleanup.json").read_text())
          if result["native_update_acceptance"]!="passed" or result["capability_enabled"] is not False:raise SystemExit("actual native result missing")
          if cleanup["host_reaped_and_socket_absent"] is not True:raise SystemExit("owned fixture cleanup unproven")
          PYTHON
      - name: Collect bounded result metadata without credentials or state archives
        if: always()
        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          import os,pathlib,shutil
          evidence=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-evidence";evidence.mkdir(exist_ok=True)
          pin=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-node-provisioning.json"
          if pin.is_file():shutil.copyfile(pin,evidence/pin.name)
          raw=os.environ.get("TREER_ACCEPTANCE_ROOT")
          if raw:
           root=pathlib.Path(raw)
           for name in ["acceptance-input.json","native-acceptance-result.json","fixture-cleanup.json"]:
            p=root/name
            if p.is_file() and p.stat().st_size<=65536:shutil.copyfile(p,evidence/name)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: treer222-native-e936adcf
          path: ${{ runner.temp }}/treer222-evidence/
          if-no-files-found: error
          retention-days: 14
