name: Host startup budget distinction 224
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-isolation:
    name: Host isolation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d12954a131fcbfa97f53058c6106e8d2c62de16c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: host224-native
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Targeted Host first regression with bootstrap phases
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess
          source='d12954a131fcbfa97f53058c6106e8d2c62de16c'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          command=['cargo','test','--locked','-p','treer-agent-host','isolation_tests::real_pty_backpressure_preserves_other_workload_control_and_unknown_no_replay','--','--exact','--nocapture','--test-threads=1']
          result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          print(result.stdout,flush=True)
          row={'source_sha':source,'workflow_sha':os.environ['GITHUB_SHA'],'test':'isolation_tests::real_pty_backpressure_preserves_other_workload_control_and_unknown_no_replay','exit_code':result.returncode,'passed':result.returncode==0 and bool(re.search(r'test result: ok\. 1 passed; 0 failed;',result.stdout)),'install_restart':False}
          print('HOST_BOOTSTRAP_224_RESULT '+json.dumps(row,sort_keys=True),flush=True)
          assert row['passed'], 'Host bootstrap diagnostic test not passed; raw bounded phase evidence retained'
          PYTHON
