name: Linux native Launcher 240
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a5b3525aae85dd7f1dc63b6a36edd32d73c3d339
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install fixed compiler
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build only exact-source native release and check hooks
        shell: bash
        run: |
          python3 - <<'PYBUILD'
          import os,pathlib,subprocess,json,hashlib,shutil
          source="a5b3525aae85dd7f1dc63b6a36edd32d73c3d339"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==source
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"linux240";out.mkdir(mode=0o700)
          validation=pathlib.Path("/usr/bin/true").resolve()
          for target,home,claude in [("alienware","/home/zijian",None),("mariana","/h/28/zijian","/h/28/zijian/.local/share/claude/versions/2.1.302")]:
           env=os.environ.copy()
           for k in list(env):
            if k.startswith(("TREER_","SPIKE_","RUST_SPIKE_","CODEX_","CLAUDE_")):del env[k]
           env["CARGO_TARGET_DIR"]=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"native-target")
           paths={"TREER":home+"/.local/bin/treer","CODEX":home+"/.local/share/treer/codex/0.162.1/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"}
           if claude:paths["CLAUDE"]=claude
           for tool,path in paths.items():env["TREER_SPIKE_BUILD_"+tool]=str(validation);env["TREER_SPIKE_TARGET_"+tool]=path
           subprocess.run(["cargo","+1.90.0","build","--locked","--release","--manifest-path","launchers/agent-rust/Cargo.toml"],env=env,check=True)
           d=out/target;d.mkdir();f=d/"treer-agent-rust-spike";shutil.copy2(pathlib.Path(env["CARGO_TARGET_DIR"])/"release/treer-agent-rust-spike",f)
           testenv=os.environ.copy();testenv["RUST_SPIKE_RELEASE_BIN"]=str(f)
           with (d/"default-guard.log").open("w") as log:subprocess.run(["node","--test","launchers/agent-rust/tests/default-build.mjs"],env=testenv,stdout=log,stderr=subprocess.STDOUT,check=True)
           dynamic=subprocess.check_output(["readelf","-l",str(f)],text=True)
           symbols=subprocess.check_output(["objdump","-T",str(f)],text=True)
           import re
           versions=sorted(set(re.findall(r"GLIBC_([0-9.]+)",symbols)),key=lambda x:tuple(map(int,x.split("."))))
           p={"source":source,"target":"x86_64-unknown-linux-gnu","profile":"release default features no fixture","target_binding":target,"deployment_tool_paths":paths,"build_validation_image":{"path":str(validation),"sha256":hashlib.sha256(validation.read_bytes()).hexdigest(),"scope":"build.rs native-header validation only; supported separate deployment-path binding; not native provider execution or validation of installed tool content"},"executable":{"bytes":f.stat().st_size,"sha256":hashlib.sha256(f.read_bytes()).hexdigest()},"rustc":subprocess.check_output(["rustc","+1.90.0","--version"],text=True).strip(),"max_glibc":versions[-1],"default_guard":"PASS1","provider_execution":"NOT_RUN"}
           (d/"build-provenance.json").write_text(json.dumps(p,indent=2))
          shutil.copytree("launchers/agent/public",out/"public")
          (out/"SOURCE.json").write_text(json.dumps({"source":source,"public_source":"837704120ab2a06d06bfe0d2c1a931a5179db6dc","profiles":["alienware","mariana"],"scope":"Linux images only; deployment manifests require fresh real target tool hashes, no installation"},indent=2))
          PYBUILD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher240-linux-a5b3525a
          path: ${{ runner.temp }}/linux240
          if-no-files-found: error
