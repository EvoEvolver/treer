name: Disposable updater target inventory
run-name: Inventory222 fdc19970 once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Measure actual disposable account and manager prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Metadata only, for a GitHub-hosted disposable Ubuntu job; no installation."""
          import os,pwd,pathlib,subprocess,json,hashlib,stat
          assert os.environ.get("GITHUB_ACTIONS")=="true"
          assert os.environ.get("RUNNER_ENVIRONMENT")=="github-hosted"
          assert os.uname().sysname=="Linux"
          assert os.geteuid()!=0, "nonroot hosted account required"
          u=pwd.getpwuid(os.geteuid()); home=pathlib.Path(u.pw_dir).resolve(strict=True)
          def command(argv):
           try:
            p=subprocess.run(argv,capture_output=True,text=True,timeout=8)
            return p.returncode,p.stdout.strip()
           except (OSError,subprocess.TimeoutExpired):return None,""
          result={"schema":1,"scope":"disposable hosted CI metadata only","uid":u.pw_uid,"gid":u.pw_gid,"account":u.pw_name,"passwd_home":str(home),"environment_home_matches":pathlib.Path(os.environ["HOME"]).resolve()==home,"home_owner_matches":home.stat().st_uid==u.pw_uid,"home_mode":oct(stat.S_IMODE(home.stat().st_mode)),"home_group_other_writable":bool(home.stat().st_mode&0o022),"pid":os.getpid(),"ppid":os.getppid(),"sid":os.getsid(0),"pgrp":os.getpgrp(),"runner_os":os.environ.get("RUNNER_OS"),"runner_arch":os.environ.get("RUNNER_ARCH"),"image_os":os.environ.get("ImageOS"),"image_version":os.environ.get("ImageVersion"),"node_candidates":[]}
          for name in ["/opt/homebrew/bin/node","/usr/local/bin/node","/usr/bin/node"]:
           p=pathlib.Path(name)
           if not p.exists():
            result["node_candidates"].append({"path":name,"exists":False});continue
           real=p.resolve(strict=True); st=real.stat();code,version=command([str(real),"--version"])
           result["node_candidates"].append({"path":name,"exists":True,"realpath":str(real),"uid":st.st_uid,"gid":st.st_gid,"mode":oct(stat.S_IMODE(st.st_mode)),"group_other_writable":bool(st.st_mode&0o022),"sha256":hashlib.sha256(real.read_bytes()).hexdigest(),"version":version if code==0 and version.startswith("v") and len(version)<40 else None,"exit":code})
          parent_code,parent=command(["ps","-p",str(os.getppid()),"-o","pid=,ppid=,sid=,pgid=,comm="])
          result["parent_metadata"]=parent if parent_code==0 and len(parent)<512 else None
          result["user_manager_queries"]={}
          for args in [["systemctl","--user","show-environment"],["systemctl","--user","list-unit-files","--no-pager"]]:
           try:
            p=subprocess.run(args,capture_output=True,text=True,timeout=8)
            category="available" if p.returncode==0 else "query_failed"
            for marker,label in [("Failed to connect to bus","bus_unavailable"),("No medium found","bus_unavailable"),("Permission denied","permission_denied")]:
             if marker.lower() in p.stderr.lower():category=label
            result["user_manager_queries"][args[2]]={"exit":p.returncode,"category":category}
           except subprocess.TimeoutExpired:result["user_manager_queries"][args[2]]={"exit":None,"category":"timeout"}
           except FileNotFoundError:result["user_manager_queries"][args[2]]={"exit":None,"category":"command_unavailable"}
          code=result["user_manager_queries"]["show-environment"]["exit"]
          result["systemd_user_bus_query_exit"]=code
          code,version=command(["systemctl","--version"])
          result["systemctl_present"]=code==0
          runtime=pathlib.Path("/run/user")/str(u.pw_uid)
          result["runtime_directory_exists"]=runtime.is_dir()
          result["user_bus_socket_exists"]=(runtime/"bus").is_socket()
          result["manager_acceptance"]="NOT_RUN"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"treer222-capability.json"
          with out.open("x") as f:json.dump(result,f,indent=2);f.write("\n")
          print(json.dumps(result))
          PYTHON
      - name: Preserve bounded capability metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: treer222-disposable-target
          path: ${{ runner.temp }}/treer222-capability.json
          if-no-files-found: error
          retention-days: 7
