name: Check documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - "justfile"
      - "scripts/check-docs.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - "justfile"
      - "scripts/check-docs.mjs"

permissions:
  contents: read

jobs:
  docs:
    name: Links and indexes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check documentation
        run: node scripts/check-docs.mjs
