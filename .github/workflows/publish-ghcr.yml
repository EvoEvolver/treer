name: Publish GHCR images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to point a channel at, for example v0.1.3
        required: true
        type: string
      channel:
        description: Mutable channel pointer to move after Canary or Production
        required: true
        type: choice
        options:
          - canary
          - stable

permissions:
  contents: read

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: treer-proxy
            file: Dockerfile
            context: .
            runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - image: treer-proxy
            file: Dockerfile
            context: .
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
          - image: treer-app
            file: web/Dockerfile
            context: ./web
            runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - image: treer-app
            file: web/Dockerfile
            context: ./web
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
          - image: treer-updater
            file: deploy/updater/Dockerfile
            context: ./deploy/updater
            runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - image: treer-updater
            file: deploy/updater/Dockerfile
            context: ./deploy/updater
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test "${tag}" != "latest"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "${tag}" = "v${cargo_version}"

      - name: Lowercase image owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            TREER_VERSION=${{ github.ref_name }}
            TREER_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.suffix }}

  merge:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        image: [treer-proxy, treer-app, treer-updater]
    steps:
      - name: Lowercase image owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Create version, digest, and canary tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" \
            -t "${IMAGE}:canary" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA}-arm64"

  retag:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TREER_RELEASE_VERSION: ${{ inputs.version }}
      TREER_RELEASE_CHANNEL: ${{ inputs.channel }}
    strategy:
      matrix:
        image: [treer-proxy, treer-app, treer-updater]
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate channel inputs before registry login
        run: bash scripts/retag-ghcr.sh validate

      - name: Lowercase image owner
        id: owner
        shell: bash
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Point channel tag at the version digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}
        shell: bash
        run: bash scripts/retag-ghcr.sh apply
