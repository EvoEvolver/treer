name: Build release artifacts
run-name: UI bundle diagnostic ${{ inputs.revision || github.sha }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to build (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: UI bundle diagnostic (windows)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked UI tooling without lifecycle scripts
        shell: pwsh
        run: |
          git config --get core.autocrlf
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare the built UI with the committed public files
        shell: pwsh
        run: node launchers/agent/scripts/diag-ui-bundle.mjs
