name: Build release artifacts
run-name: Windows extraction diagnostic ${{ inputs.revision || github.sha }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to build (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUST_VERSION: 1.90.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Record source commit
        run: '"TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified launcher payload
        run: |
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-launcher-release.mjs --output "$env:RUNNER_TEMP/treer-launcher-payload" --source-commit "$env:TREER_BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select MSVC Rust
        run: |
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version --verbose
      - name: Run embedded extraction regression and sibling Windows launcher tests
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server launcher::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
