name: Build release artifacts
run-name: Machine artifacts ${{ inputs.revision || github.sha }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to build (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUST_VERSION: 1.90.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Record source commit
        run: '"TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified launcher payload
        run: |
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-launcher-release.mjs --output "$env:RUNNER_TEMP/treer-launcher-payload" --source-commit "$env:TREER_BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select MSVC Rust
        run: |
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version --verbose
      - name: Test local transport, process ownership and ConPTY
        run: |
          cargo test --locked -p treer-platform -p treer-agent-runtime -p treer-agent-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-agent-server --bin treer-agent-server windows_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native file-transfer Controller and CLI boundaries
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server machine_file_transfer::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-cli --bin treer machine_file::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test machine registration lock and replacement
        # The registration lock is a named mutex on Windows and the contender case
        # runs a separate process for about two minutes; both must execute natively.
        timeout-minutes: 8
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server service::tests::machine_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test private-state placement rule (must run both tests)
        # The placement predicate walks to the drive root and the Controller matrix
        # decides whether image uploads stay enabled; the windows_ filter above does
        # not select them, so name them exactly and fail if either did not run.
        run: |
          $output = cargo test --locked -p treer-agent-server --bin treer-agent-server -- --exact `
            private_state::placement_tests::placement_allows_hidden_state_under_a_plain_home_and_refuses_repositories `
            controller::private_state_tests::hidden_private_state_under_a_plain_home_is_injected_until_a_repository_appears 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch '(?m)^test result: ok\. 2 passed; 0 failed') { Write-Host 'both placement tests must run'; exit 1 }
      - name: Build machine binaries
        # /Brepro replaces the linker timestamp with a content hash so the same source
        # on the same pinned image links to the same bytes. It is the only link argument.
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: cargo build --locked --release -p treer-cli -p treer-agent-host -p treer-agent-server
      - name: Windows administrator requirement (standard user, disposable runner)
        # Creates a temporary standard local user: the script itself refuses to run
        # unless this is a GitHub-hosted runner. Never enable it on self-hosted machines.
        timeout-minutes: 10
        env:
          TREER_DISPOSABLE_RUNNER: '1'
        run: |
          ./scripts/windows-standard-user-check.ps1 -InstallScript ./scripts/install.ps1 -AgentServer ./target/release/treer-agent-server.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real Controller and CLI
        run: |
          cargo build --locked -p treer-agent-host -p treer-agent-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-cli --test controller -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p treer-agent-server --bin treer-agent-server windows_real_host -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage artifacts
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: ./scripts/stage-release-artifacts.ps1 -Destination release-artifacts/windows-x86_64
      - name: Verify the staged binaries rebuild to the same bytes
        # Fails closed before upload: the hashes compared are the staged (published) ones.
        # The staged copies survive the clean; the rebuild uses the same flags, path and
        # package set, because building fewer packages can change feature unification.
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: |
          $staged = @{}
          foreach ($binary in @('treer', 'treer-agent-host', 'treer-agent-server')) {
            $staged[$binary] = (Get-FileHash -Algorithm SHA256 "release-artifacts/windows-x86_64/$binary").Hash.ToLowerInvariant()
          }
          cargo clean --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p treer-cli -p treer-agent-host -p treer-agent-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $different = @()
          foreach ($binary in @('treer', 'treer-agent-host', 'treer-agent-server')) {
            $rebuilt = (Get-FileHash -Algorithm SHA256 "target/release/$binary.exe").Hash.ToLowerInvariant()
            Write-Host "$binary staged $($staged[$binary]) rebuilt $rebuilt"
            if ($staged[$binary] -ne $rebuilt) { $different += $binary }
          }
          if ($different.Count -gt 0) { throw "Clean rebuild is not byte-identical to the staged artifact: $($different -join ', ')." }
      - name: Test Windows installation and PATH
        run: ./scripts/test-windows-install.ps1 -ArtifactDirectory release-artifacts/windows-x86_64
      - name: Test Windows PowerShell installer compatibility
        shell: powershell
        run: ./scripts/test-windows-install.ps1 -ArtifactDirectory release-artifacts/windows-x86_64
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treer-windows-x86_64
          path: release-artifacts/windows-x86_64/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            system: Linux
            architecture: x86_64
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            system: Linux
            architecture: aarch64
          - platform: darwin-x86_64
            runner: macos-15-intel
            system: Darwin
            architecture: x86_64
          - platform: darwin-aarch64
            runner: macos-15
            system: Darwin
            architecture: arm64

    env:
      RUST_VERSION: 1.90.0

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}

      - name: Record source commit
        shell: bash
        run: echo "TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Prepare verified launcher payload
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix launchers/agent ci --ignore-scripts
          node scripts/prepare-launcher-release.mjs --output "$RUNNER_TEMP/treer-launcher-payload" --source-commit "$TREER_BUILD_COMMIT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify native runner
        shell: bash
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Select stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version --verbose

      - name: Build agent binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            -p treer-cli \
            -p treer-agent-host \
            -p treer-agent-server

      - name: Stage and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/stage-release-artifacts.sh \
            "${{ matrix.platform }}" \
            "release-artifacts/${{ matrix.platform }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treer-${{ matrix.platform }}
          path: release-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

      # The single-container image consumes the native Proxy of THIS run. It is a separate artifact so
      # the machine artifact layout, checksums and reuse rules stay exactly as they are.
      - name: Build native Proxy (Linux image input)
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p treer-proxy
          sh scripts/stage-release-artifacts.sh --proxy \
            "${{ matrix.platform }}" \
            "release-artifacts-proxy/${{ matrix.platform }}"

      - name: Upload native Proxy artifact
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treer-proxy-${{ matrix.platform }}
          path: release-artifacts-proxy/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  single-container-input:
    name: Single-container native input
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      input_sha256: ${{ steps.assemble.outputs.input_sha256 }}
      commit: ${{ steps.assemble.outputs.commit }}
      version: ${{ steps.assemble.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}

      - name: Download native artifacts of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: treer-*linux-*
          path: native-artifacts

      - name: Assemble the exact-SHA input and publish its digest
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "${#commit}" -eq 40
          version=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)
          ls native-artifacts
          digest=$(python3 -I scripts/assemble-single-container-input.py native-artifacts .single-container-input)
          echo "input_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the staged input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: single-container-input
          path: .single-container-input/
          # The directory name starts with a dot, which upload-artifact treats as hidden.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  single-container-image:
    name: Single-container image and smoke ${{ matrix.platform }}
    needs: single-container-input
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
            architecture: x86_64
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
            architecture: aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}

      - name: Verify checkout and native runner
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.single-container-input.outputs.commit }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Download the staged input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: single-container-input
          path: .single-container-input

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build the image from the staged native input (no push)
        shell: bash
        env:
          TREER_BUILD_COMMIT: ${{ needs.single-container-input.outputs.commit }}
          TREER_VERSION: ${{ needs.single-container-input.outputs.version }}
          TREER_NATIVE_INPUT_SHA256: ${{ needs.single-container-input.outputs.input_sha256 }}
        run: |
          set -euo pipefail
          docker buildx build --load --platform "${{ matrix.docker_platform }}" \
            -f Dockerfile.single \
            --build-arg TREER_BUILD_COMMIT="$TREER_BUILD_COMMIT" \
            --build-arg TREER_VERSION="$TREER_VERSION" \
            --build-arg TREER_NATIVE_INPUT_SHA256="$TREER_NATIVE_INPUT_SHA256" \
            -t treer-single:ci .
          revision=$(docker image inspect treer-single:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$TREER_BUILD_COMMIT"

      - name: Real image smoke (server, machine, Host rules, first start, enroll, create, restart)
        shell: bash
        run: node deploy/single-container/smoke.mjs treer-single:ci
