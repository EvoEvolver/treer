name: Build release artifacts
run-name: Windows extraction diagnostic ${{ inputs.revision || github.sha }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to build (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUST_VERSION: 1.90.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Record source commit
        run: '"TREER_BUILD_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified launcher payload
        run: |
          npm --prefix launchers/agent ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-launcher-release.mjs --output "$env:RUNNER_TEMP/treer-launcher-payload" --source-commit "$env:TREER_BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select MSVC Rust
        run: |
          rustup toolchain install "${env:RUST_VERSION}-x86_64-pc-windows-msvc" --profile minimal
          rustup default "${env:RUST_VERSION}-x86_64-pc-windows-msvc"
          rustc --version --verbose
      - name: Build exact Controller test executable without running tests
        run: |
          cargo test --locked -p treer-agent-server --bin treer-agent-server --no-run --message-format=json > test-build.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bins = @(Get-Content test-build.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'treer-agent-server' -and $_.profile.test -eq $true -and $_.executable })
          if ($bins.Count -ne 1) { throw 'Expected exactly one Controller test binary' }
          New-Item -ItemType Directory -Path test-binary/deps | Out-Null
          Copy-Item -LiteralPath $bins[0].executable -Destination test-binary/deps/controller-tests.exe
          $hash = (Get-FileHash test-binary/deps/controller-tests.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "diagnostic-controller-sha256=$hash"
          Write-Output "diagnostic-source-commit=0d18410c37856b55d594d5acff117dde66ff6dc3"
          "$hash  deps/controller-tests.exe" | Set-Content -Encoding ascii test-binary/SHA256SUMS
          "0d18410c37856b55d594d5acff117dde66ff6dc3" | Set-Content -Encoding ascii test-binary/SOURCE_COMMIT
      - name: Upload diagnostic test executable only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-0d18410-controller-tests
          path: test-binary/
          if-no-files-found: error
          retention-days: 3
