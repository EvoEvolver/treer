name: Build release artifacts
run-name: Windows update diagnostic ${{ inputs.revision || github.sha }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to build (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows detached-parent diagnostic
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Diagnose detached parent under pwsh 7
        shell: pwsh
        run: ./scripts/diag-windows-detached-parent.ps1 -Iterations 3
      - name: Diagnose detached parent under Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/diag-windows-detached-parent.ps1 -Iterations 3
